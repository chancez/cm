[settings]
lockfile = true

[tools]
go = "prefix:1.27"
protoc = "35.1"
buf = "1.72.0"
# Only needed by the `libghostty` task to build libghostty-vt from source.
zig = "0.17.0"
# Pinned so the shell-integration tests exercise fish rather than skipping it. bash and zsh are not here
# on purpose: both ship with macOS and every Linux image used for these tests, and pinning a second copy
# would test a shell nobody runs cm under. fish is the one a machine may genuinely lack, and a skipped
# test that looks like a pass is how a broken script ships.
"aqua:fish-shell/fish-shell" = "4.8.1"

[env]
# libghostty-vt has no tagged release and its API is explicitly unstable, so pin a commit. It has to be the
# commit go.mitchellh.com/libghostty pins in its CMakeLists.txt, since the binding is written against that
# API: bump both together, and TestGhosttyRefMatchesBinding fails when they disagree. build, test and
# install build the new pin themselves.
#
# The full SHA, and it has to be: `git fetch --depth 1 origin <abbrev>` answers "couldn't find remote ref",
# because the fetch protocol matches refs and full object names and not prefixes of either. This was pinned
# as "4d605bf0d" and the libghostty task therefore could not work on a fresh checkout at all -- it cloned,
# then died on the next line. Dockerfile.test already carried the full SHA with a comment naming the
# abbreviation here as the reason, so the workaround outlived the bug by being in the wrong file.
GHOSTTY_REF = "f54340ad77814fe319d136e5e915d6a48de8dd23"
# A git repository the build fetches into. Only its objects are used: the build runs from an exported copy
# of GHOSTTY_REF, so a checkout here can be a real one with work in it.
GHOSTTY_DIR = "{{config_root}}/third_party/ghostty"
# One directory per pin, so a branch on another pin, or a worktree sharing third_party, uses its own build
# rather than rebuilding the one every other checkout links. Switching back costs nothing.
GHOSTTY_PREFIX = "{{config_root}}/third_party/libghostty-vt/{{env.GHOSTTY_REF}}"
# Where go.mitchellh.com/libghostty finds the library. The binding links through pkg-config, static by
# default, and the .pc files record the prefix they were built for, so a build has to stay where it was made.
PKG_CONFIG_PATH = "{{env.GHOSTTY_PREFIX}}/share/pkgconfig"
# The oldest glibc a released Linux binary runs against, and the version the zig build targets there.
# Read from here by both workflows and by Dockerfile.test, so the number lives in one place.
#
# It is not a preference: zig's std picks glibc functions at comptime from the *target* version, and
# with zig's native target on an ubuntu-24.04 runner (glibc 2.39) it compiled a call to
# arc4random_buf, which is glibc 2.36. That one symbol made cm 0.4.0 fail to start on Ubuntu 22.04,
# whose glibc is 2.35, with "GLIBC_2.36 not found". Pinning 2.34 as the target makes zig use
# getrandom instead. See docs/libghostty.md.
#
# 2.34 rather than lower because that is what the Go and cgo link against the runner's own libc
# already needs, pthread_create and friends having moved into libc there. Lowering it further means
# doing that link against an older glibc too.
#
# Not applied by the `libghostty` task below, which builds natively: a local archive is not
# distributed, and the pin would need per-OS handling in a task a macOS developer runs.
GLIBC_FLOOR = "2.34"
# Generated protoc plugins install here so generation does not depend on the
# ambient GOPATH/bin.
GOBIN = "{{config_root}}/bin/tools"
_.path = ["{{config_root}}/bin/tools"]

# Task scripts are POSIX sh, not bash, because mise runs them with `sh` and that is dash on Debian and
# Ubuntu while it is bash on macOS. So a bash-ism works here and fails there, silently until somebody builds
# on Linux: `set -o pipefail` in every task below made `mise run libghostty` die with "Illegal option -o
# pipefail" on a host that had bash 5.1 installed and simply was not using it.
#
# CI did not catch it because the workflows reimplement the libghostty build rather than running this task,
# so the task itself has no coverage anywhere. Worth knowing before trusting that a change here works.
#
# A task that genuinely needs bash can ask for it with `shell = "bash -c"`, which mise honours. None does:
# there is not one pipeline in this file, so pipefail was protecting nothing and costing portability.

[tasks.build]
description = "Build the cm binary"
depends = ["libghostty"]
run = "go build -o bin/cm ./cmd/cm"

[tasks.install]
description = "Build and install cm into PREFIX (default ~/.local)"
depends = ["build"]
# Installs to $PREFIX/bin, defaulting to ~/.local, so `mise run install` needs no arguments and
# PREFIX=/usr/local mise run install works for a system install.
#
# The rename is the whole point of having this as a task rather than a cp.
#
# Copying onto a path whose binary has a running process gets the new invocation SIGKILLed on macOS:
# cp writes into the existing inode, which invalidates the kernel's cached code-signature pages that
# the live process still maps, and every later exec of that path dies with signal 9. It presents as
# `zsh: killed  cm ls` with nothing in any log, and it cost an hour to pin down. Verified: cp gives 137
# three times in a row where mv gives 0, and the already-running server survives either way because it
# holds the old inode.
#
# Renaming from a temporary file in the same directory is also atomic, so a concurrent exec sees either
# the old binary or the new one, never a partial write. The temp file must be on the same filesystem for
# rename to work, which is why it is created next to the target rather than in /tmp.
run = """
set -eu
prefix="${PREFIX:-$HOME/.local}"
bindir="$prefix/bin"
mkdir -p "$bindir"

tmp="$(mktemp "$bindir/.cm.XXXXXX")"
trap 'rm -f "$tmp"' EXIT
cp bin/cm "$tmp"
chmod 755 "$tmp"
mv -f "$tmp" "$bindir/cm"
trap - EXIT

echo "installed $("$bindir/cm" --version) to $bindir/cm"
if ! command -v cm >/dev/null 2>&1; then
  echo "note: cm is not on PATH; add $bindir to it" >&2
elif [ "$(command -v cm)" != "$bindir/cm" ]; then
  echo "note: $(command -v cm) shadows $bindir/cm on PATH" >&2
fi
"""

[tasks.uninstall]
description = "Remove cm from PREFIX (default ~/.local)"
# Here so the install has an inverse, and because it is the safe way to stop cm: removing the binary
# leaves running servers and shims alone, since they hold their own inode. Stop them first with
# `cm server stop` if that is what you want.
run = """
set -eu
prefix="${PREFIX:-$HOME/.local}"
target="$prefix/bin/cm"
if [ -e "$target" ]; then
  rm -f "$target"
  echo "removed $target"
else
  echo "$target is not installed"
fi
"""

[tasks.test]
description = "Run tests"
depends = ["libghostty"]
run = "go test ./..."

[tasks.fmt]
description = "Format Go code"
run = "go fmt ./..."

[tasks.vet]
description = "Vet Go code"
depends = ["libghostty"]
run = "go vet ./..."

[tasks.validate-plugin]
description = "Validate the plugin marketplace manifests"
# The marketplace is how the cm skill reaches Claude Code users, and a broken manifest is invisible
# here: nothing in this repo reads it, so the first symptom is someone else's `/plugin install`
# failing. Cheap to check, and the check is the only thing standing between a stray comma and that.
#
# Two invocations, because they check different things. Pointed at the root, the validator reads
# marketplace.json and each entry's plugin.json, but not the skills those plugins declare. Pointed at
# the plugin directory, it also parses the SKILL.md frontmatter, which is where a bad `description:`
# would otherwise load with no metadata and simply never trigger.
#
# Skipped rather than failed when claude is absent, so a contributor without it can still run `check`.
run = """
set -eu
if ! command -v claude >/dev/null; then
  echo "claude not installed, skipping plugin manifest validation"
  exit 0
fi
claude plugin validate .
claude plugin validate ./.claude-plugin/plugins/cm
"""

[tasks.check]
description = "Format, vet, test, and validate the plugin manifests"
depends = ["fmt", "vet", "test", "validate-plugin"]

[tasks.test-linux]
description = "Run the tests on Linux in Docker, with libghostty"
# Verifies the platform-specific code that a macOS-only run never compiles, and catches shell
# assumptions, since /bin/sh here is dash rather than bash.
#
# libghostty-vt is built from source, so screen restore, history, and adoption-with-scrollback are
# exercised rather than skipped. Those are where cm's hardest bugs have been.
#
# There used to be a second, no-cgo image on the theory that cm should degrade rather than break without
# the emulator. It was retired: `cm read`, `cm history`, and screen restore are most of what cm does, and a
# build where they return empty *successfully* is a worse outcome than one that does not build. It also cost
# real time twice, once when a test read nothing and once when a readiness check could never be satisfied,
# both presenting as bugs in cm rather than a missing emulator.
#
# Slow to build the first time, since it compiles libghostty with zig. Cached after that.
run = """
set -eu
docker build -f Dockerfile.test -t cm-test:latest \
  --build-arg ZIG_VERSION="$(zig version)" \
  --build-arg GHOSTTY_REF="$GHOSTTY_REF" \
  --build-arg GLIBC_FLOOR="$GLIBC_FLOOR" .
docker run --rm cm-test:latest
"""

[tasks.build-linux]
description = "Check the Linux build compiles, in Docker"
# In Docker rather than cross-compiled, because cgo is required and a cgo cross-build needs a Linux
# libghostty and cross toolchain. The image already builds one, so this reuses it and asks only whether the
# Linux-specific files compile -- which a macOS-only run never checks.
run = """
set -eu
docker build -f Dockerfile.test -t cm-test:latest \
  --build-arg ZIG_VERSION="$(zig version)" \
  --build-arg GHOSTTY_REF="$GHOSTTY_REF" \
  --build-arg GLIBC_FLOOR="$GLIBC_FLOOR" .
docker run --rm cm-test:latest go build ./...
"""

[tasks.tools]
description = "Install the protoc plugins pinned in go.mod"
run = "go install google.golang.org/protobuf/cmd/protoc-gen-go github.com/containerd/ttrpc/cmd/protoc-gen-go-ttrpc"

[tasks.generate]
description = "Regenerate protobuf and ttrpc code"
depends = ["tools"]
run = "buf generate"
sources = ["proto/**/*.proto", "buf.gen.yaml"]
outputs = ["proto/**/*.pb.go"]

[tasks.libghostty]
description = "Build libghostty-vt at GHOSTTY_REF, unless that build already exists"
# A dependency of every task that compiles cm, so a pin change on a branch is built on the next build rather
# than remembered. When the pin's build exists this returns in milliseconds. The build itself, and why each
# flag is there, is in scripts/libghostty.sh, which Dockerfile.test and both workflows run too.
run = "sh scripts/libghostty.sh"
