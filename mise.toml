[tools]
go = "1.26.5"
protoc = "35.1"
buf = "1.72.0"
# Only needed by the `libghostty` task to build libghostty-vt from source.
zig = "0.16.0"
# Pinned so the shell-integration tests exercise fish rather than skipping it. bash and zsh are not here
# on purpose: both ship with macOS and every Linux image used for these tests, and pinning a second copy
# would test a shell nobody runs cm under. fish is the one a machine may genuinely lack, and a skipped
# test that looks like a pass is how a broken script ships.
"aqua:fish-shell/fish-shell" = "4.8.1"

[env]
# libghostty-vt has no tagged release and its API is explicitly unstable, so pin a
# commit. Bumping this is a deliberate act: re-run `mise run libghostty` after.
GHOSTTY_REF = "4d605bf0d"
GHOSTTY_DIR = "{{config_root}}/third_party/ghostty"
GHOSTTY_PREFIX = "{{config_root}}/third_party/ghostty/zig-out"
# Generated protoc plugins install here so generation does not depend on the
# ambient GOPATH/bin.
GOBIN = "{{config_root}}/bin/tools"
_.path = ["{{config_root}}/bin/tools"]

[tasks.build]
description = "Build the cm binary"
run = "go build -o bin/cm ./cmd/cm"

[tasks.install]
description = "Build and install cm into PREFIX (default ~/.local)"
depends = ["build"]
# Installs to $PREFIX/bin, defaulting to ~/.local, so `mise run install` needs no arguments and
# PREFIX=/usr/local mise run install works for a system install.
#
# The rename is the whole point of having this as a task rather than a cp.
#
# Copying onto a path whose binary has a running process gets the new invocation SIGKILLed on macOS:
# cp writes into the existing inode, which invalidates the kernel's cached code-signature pages that
# the live process still maps, and every later exec of that path dies with signal 9. It presents as
# `zsh: killed  cm ls` with nothing in any log, and it cost an hour to pin down. Verified: cp gives 137
# three times in a row where mv gives 0, and the already-running server survives either way because it
# holds the old inode.
#
# Renaming from a temporary file in the same directory is also atomic, so a concurrent exec sees either
# the old binary or the new one, never a partial write. The temp file must be on the same filesystem for
# rename to work, which is why it is created next to the target rather than in /tmp.
run = """
set -euo pipefail
prefix="${PREFIX:-$HOME/.local}"
bindir="$prefix/bin"
mkdir -p "$bindir"

tmp="$(mktemp "$bindir/.cm.XXXXXX")"
trap 'rm -f "$tmp"' EXIT
cp bin/cm "$tmp"
chmod 755 "$tmp"
mv -f "$tmp" "$bindir/cm"
trap - EXIT

echo "installed $("$bindir/cm" --version) to $bindir/cm"
if ! command -v cm >/dev/null 2>&1; then
  echo "note: cm is not on PATH; add $bindir to it" >&2
elif [ "$(command -v cm)" != "$bindir/cm" ]; then
  echo "note: $(command -v cm) shadows $bindir/cm on PATH" >&2
fi
"""

[tasks.uninstall]
description = "Remove cm from PREFIX (default ~/.local)"
# Here so the install has an inverse, and because it is the safe way to stop cm: removing the binary
# leaves running servers and shims alone, since they hold their own inode. Stop them first with
# `cm server stop` if that is what you want.
run = """
set -euo pipefail
prefix="${PREFIX:-$HOME/.local}"
target="$prefix/bin/cm"
if [ -e "$target" ]; then
  rm -f "$target"
  echo "removed $target"
else
  echo "$target is not installed"
fi
"""

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.fmt]
description = "Format Go code"
run = "go fmt ./..."

[tasks.vet]
description = "Vet Go code"
run = "go vet ./..."

[tasks.check]
description = "Format, vet, and test"
depends = ["fmt", "vet", "test"]

[tasks.test-linux]
description = "Run the tests on Linux in Docker, without cgo"
# Verifies the platform-specific code that a macOS-only run never compiles, and catches shell
# assumptions, since /bin/sh here is dash rather than bash.
#
# No cgo, so this also checks that cm degrades rather than breaks without the emulator. The tests that
# need rendering skip themselves. For full coverage use test-linux-cgo.
run = """
set -euo pipefail
docker build -f Dockerfile.test -t cm-test:latest .
docker run --rm cm-test:latest
"""

[tasks.test-linux-cgo]
description = "Run the full tests on Linux in Docker, with libghostty"
# The complete run: libghostty-vt is built from source, so screen restore, history, and
# adoption-with-scrollback are exercised rather than skipped. Those are where cm's hardest bugs have
# been, so a Linux run without them checks only half the program.
#
# Slow to build the first time, since it compiles libghostty with zig. Cached after that.
run = """
set -euo pipefail
docker build -f Dockerfile.test.cgo -t cm-test-cgo:latest .
docker run --rm cm-test-cgo:latest
"""

[tasks.build-linux]
description = "Cross-compile for Linux without cgo"
# No cgo, so no terminal rendering: screen restore and history are unavailable, everything else
# works. A cgo cross-build needs a Linux libghostty, which is what test-linux would need to grow.
run = "GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o bin/cm-linux-arm64 ./cmd/cm"

[tasks.tools]
description = "Install the protoc plugins pinned in go.mod"
run = "go install google.golang.org/protobuf/cmd/protoc-gen-go github.com/containerd/ttrpc/cmd/protoc-gen-go-ttrpc"

[tasks.generate]
description = "Regenerate protobuf and ttrpc code"
depends = ["tools"]
run = "buf generate"
sources = ["proto/**/*.proto", "buf.gen.yaml"]
outputs = ["proto/**/*.pb.go"]

[tasks.libghostty]
description = "Fetch and build libghostty-vt (needed once VT state lands)"
# Ghostty's build defaults emit-xcframework to "xcodebuild on PATH", which pulls in the
# iOS SDK at configure time and fails without full Xcode. Disabling it explicitly is
# not redundant. See the same workaround in zmx's build.zig.
run = """
set -euo pipefail
if [ ! -d "$GHOSTTY_DIR/.git" ]; then
  git clone https://github.com/ghostty-org/ghostty.git "$GHOSTTY_DIR"
fi
git -C "$GHOSTTY_DIR" fetch --depth 1 origin "$GHOSTTY_REF"
git -C "$GHOSTTY_DIR" checkout --detach FETCH_HEAD
cd "$GHOSTTY_DIR"
zig build -Demit-lib-vt=true -Demit-xcframework=false -Demit-macos-app=false
"""
sources = ["mise.toml"]
outputs = ["third_party/ghostty/zig-out/lib/libghostty-vt.a"]
