syntax = "proto3";

// Package cm.shim.v1 is the interface between the server and one session's shim.
//
// This API is frozen in a way the client-facing API is not. Upgrading the cm binary
// does not upgrade shims that are already running: they hold the pty for a live shell,
// which is the entire reason the layer exists. A new server therefore routinely talks to
// an older shim, and an older server can meet a newer shim after a downgrade.
//
// The rules that follow from that:
//   - Never remove or renumber a field, and never change a field's type or meaning.
//   - Add optional fields only, and treat their absence as "the peer predates this".
//   - Never make a new RPC load-bearing for an existing feature. A server must degrade
//     gracefully when an older shim returns "unimplemented".
//
// Keeping this surface small is the point: the shim owns the pty and an append-only log
// of output, and knows nothing about terminal emulation, scrollback, or session policy.
package cm.shim.v1;

option go_package = "github.com/chancez/cm/proto/cm/shim/v1;shimv1";

// Shim serves exactly one session, for exactly one caller: the server.
service Shim {
  // State reports the shim's status. Used both for health and, on server startup, to
  // decide whether a recorded session is still alive.
  rpc State(StateRequest) returns (StateResponse);

  // Subscribe streams terminal output starting from a sequence number, then continues
  // live. Resuming from the server's last-seen sequence is what lets the server restart
  // without losing or duplicating output.
  rpc Subscribe(SubscribeRequest) returns (stream Output);

  // Write sends bytes to the pty. Not a stream: input volume is human-scale, and unary
  // calls keep the ordering obvious.
  rpc Write(WriteRequest) returns (WriteResponse);

  // Resize sets the pty window size, which makes the kernel signal the child.
  rpc Resize(ResizeRequest) returns (ResizeResponse);

  // Signal sends a signal to the shell's process group.
  rpc Signal(SignalRequest) returns (SignalResponse);

  // Shutdown terminates the shell and exits. Killing the session, not detaching from it.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

message StateRequest {}

message StateResponse {
  // Session name this shim serves.
  string session = 1;
  // Process id of the shim itself.
  int32 shim_pid = 2;
  // Process id of the shell. Zero once it has exited.
  int32 shell_pid = 3;
  // Sequence number one past the last byte appended to the log. A subscriber that has
  // seen up to this value is fully caught up.
  uint64 next_seq = 4;
  // Lowest sequence number still retained. Output before this was truncated, so a
  // subscriber asking for less than this cannot be served exactly and must be told.
  uint64 oldest_seq = 5;
  // Whether the shell has exited.
  bool exited = 6;
  // Exit status, meaningful only when exited is true.
  int32 exit_code = 7;
  // Window size currently set on the pty.
  uint32 rows = 8;
  uint32 cols = 9;

  // The build this shim is running.
  //
  // A shim is the one part of cm that routinely outlives the binary that spawned it: it holds a pty
  // across server restarts and upgrades, so a long-lived install legitimately runs many builds at once.
  // One real install had twelve distinct builds across twenty-six shims, the oldest ten days old.
  //
  // Reported so `cm doctor` can say that rather than leaving it to be reconstructed from process
  // listings and binary inodes. Empty from a shim predating this field, which is itself a skew of at
  // least that much and is reported as unknown rather than guessed at.
  string version = 10;

  // What this shim can do, as capability tokens from internal/capability.
  //
  // A version string says two builds differ without saying what differs, which leaves every caller to
  // work out for itself what an old shim's silence means. This says it directly, because the rules at
  // the top of this file are not enough on their own: they ask a caller to read absence as "predates
  // this", and protobuf gives it no way to tell that from a shim that meant no.
  //
  // Empty from a shim predating this field, and that is why every build reporting capabilities includes
  // the "capabilities" token itself. An empty list is then conclusive -- the shim does not speak this
  // mechanism -- rather than ambiguous with a shim that supports none of them. See capability.Support:
  // the answer has three values, and only two of them are facts.
  //
  // Additive and advisory, like version above. A server that finds a capability missing degrades or says
  // so; it does not refuse to talk to the shim, which holds a live shell.
  repeated string capabilities = 11;
}

message SubscribeRequest {
  // First sequence number wanted. Zero means "from the beginning of what is retained".
  uint64 from_seq = 1;
}

// Output carries a run of pty output bytes.
message Output {
  // Sequence number of the first byte in data.
  uint64 seq = 1;
  bytes data = 2;
  // Set when the requested from_seq had already been truncated. The bytes that follow
  // start at the oldest retained sequence instead, so the receiver knows its terminal
  // state has a hole and must resynchronize rather than assume continuity.
  bool gap = 3;
}

message WriteRequest {
  bytes data = 1;
}

message WriteResponse {
  // Bytes accepted. May be short: the shim bounds its pty write buffer so a wedged
  // shell cannot make it grow without limit.
  uint64 written = 1;
}

message ResizeRequest {
  uint32 rows = 1;
  uint32 cols = 2;
  // Pixel dimensions, for programs that ask. Zero when unknown.
  uint32 x_pixel = 3;
  uint32 y_pixel = 4;

  // Make the shell see a window-size change even when the size is unchanged.
  //
  // The kernel raises SIGWINCH only when the size actually differs, so a client reattaching at
  // the size the session already has gets nothing, and a program that repaints only on SIGWINCH
  // keeps drawing against a screen that is now a replayed snapshot.
  //
  // Optional so an older shim that does not understand it simply resizes as before, which is the
  // current behavior rather than a failure.
  bool force_signal = 5;
}

message ResizeResponse {}

message SignalRequest {
  int32 signal = 1;
  // Send to the shell's process group rather than the single process, so job control
  // reaches children too.
  bool process_group = 2;
}

message SignalResponse {}

message ShutdownRequest {
  // Skip the graceful SIGHUP-then-wait and kill immediately.
  bool force = 1;
  // Signal to end the session with, overriding what force selects.
  //
  // Zero means "not specified", which is what an older server sends and what keeps this additive: a
  // shim reading zero falls back to force, so the two fields cannot disagree about a request neither
  // side has an opinion on.
  //
  // The reverse direction matters more and cannot be fixed here. An older shim ignores this field
  // entirely and honors force alone, so a newer server asking for a specific signal gets SIGHUP or
  // SIGKILL from it instead. That is a degradation rather than a failure, and the server logs it
  // rather than pretending the signal was delivered.
  //
  // It logs it by asking: the "shutdown.signal" capability in the field above is what makes the
  // substitution visible before the shell is signalled. This comment claimed the log existed for a
  // while before one did, which is the reason the capability exists at all -- a compat rule stated in
  // prose and checked nowhere is a rule the next reader believes and the code does not follow.
  int32 signal = 2;
}

message ShutdownResponse {
  // Processes still alive a moment after the signal was sent, as pids.
  //
  // Empty is the normal case and is also what an older shim returns, so a server cannot tell "nothing
  // leaked" from "this shim does not report leaks". That is acceptable here because the field only ever
  // adds a warning: absence means no warning rather than a false claim of success.
  //
  // Reported rather than escalated. The shim signals what it was asked to and says what survived, which
  // leaves the decision with the caller: a job deliberately trapping SIGHUP to finish writing a file
  // should not be SIGKILLed by the shim on its own initiative.
  repeated int32 surviving_pids = 1;
  // The process group that was signalled, for a diagnostic that can name it.
  int32 signalled_pgid = 2;
}
