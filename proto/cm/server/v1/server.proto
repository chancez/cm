syntax = "proto3";

// Package cm.server.v1 is the interface clients use. The server is the only entry point:
// clients never talk to a shim directly.
//
// Unlike the shim API, this surface may evolve. A client and server are upgraded
// together, and a client that meets an incompatible server can simply refuse to attach
// with a clear message.
package cm.server.v1;

option go_package = "github.com/chancez/cm/proto/cm/server/v1;serverv1";

service Server {
  // Attach connects a terminal to a session, creating the session if needed. The stream
  // is bidirectional and long-lived, and carries both input and control events such as
  // resize so their ordering relative to keystrokes is preserved.
  rpc Attach(stream AttachRequest) returns (stream AttachResponse);

  // List reports known sessions.
  rpc List(ListRequest) returns (ListResponse);

  // Kill terminates sessions and their shells.
  rpc Kill(KillRequest) returns (KillResponse);

  // Send writes bytes to a session's shell without attaching to it.
  rpc Send(SendRequest) returns (SendResponse);

  // History returns a session's contents, scrollback included, for printing or piping.
  rpc History(HistoryRequest) returns (HistoryResponse);

  // GetEnv returns the environment variables the session's most recent client reported.
  //
  // A shell inside a session cannot learn these any other way: nothing outside a process can
  // change its environment, so the shell has to ask and apply the result itself.
  rpc GetEnv(GetEnvRequest) returns (GetEnvResponse);

  // Report records what a program in a session says it is doing.
  //
  // Deliberately not agent-specific: cm has no notion of an agent, and a state a program reports is
  // just a state. A build script, a test runner, and a coding agent's hook all use the same call.
  rpc Report(ReportRequest) returns (ReportResponse);

  // Read returns a bounded, parseable view of a session's recent output.
  //
  // Distinct from History, which renders everything: a caller reading a session programmatically wants
  // the tail, with soft-wrapped lines rejoined so a path broken to fit the terminal is one line again.
  rpc Read(ReadRequest) returns (ReadResponse);

  // Wait blocks until a session reaches a state, so a caller can sequence work without polling.
  //
  // Server-side rather than a client loop: the server already watches the output stream, so it can
  // answer from an event instead of a caller sampling `list` and racing the transition it wanted.
  rpc Wait(WaitRequest) returns (WaitResponse);

  // Doctor reports problems with the installation, and optionally repairs them.
  //
  // Server-side because the answer needs the session records and the runtime directory together, and the
  // server already has both. A client scanning the directory itself would have to reimplement the socket
  // naming and could not read the database.
  rpc Doctor(DoctorRequest) returns (DoctorResponse);

  // Signal sends a signal to a session's shell, and by default to its process group.
  //
  // Distinct from writing a control character with Send, which is not a duplicate of this: a control
  // character goes through the pty's line discipline, so it reaches whatever has the terminal and only
  // becomes a signal if that program's termios says so. This delivers a signal directly, which is what
  // reaches a program that reads its input raw, or a session with no foreground job to interrupt.
  rpc Signal(SignalRequest) returns (SignalResponse);

  // Tag sets or removes a session's tags.
  //
  // Separate from Attach because tagging an existing session must not require attaching to it: a
  // caller correcting a tag has no terminal to wire up, and opening an attach stream to change
  // metadata would create the session if the name were wrong.
  rpc Tag(TagRequest) returns (TagResponse);

  // Bind points a name at a session, and Unbind removes a name.
  //
  // Separate calls rather than flags on Attach because neither one attaches: naming a session that
  // already exists has no terminal to wire up, and an attach that also bound would create a session when
  // the name was wrong.
  rpc Bind(BindRequest) returns (BindResponse);
  rpc Unbind(UnbindRequest) returns (UnbindResponse);

  // Switch points a session's client at a different session, in place.
  //
  // The client replaces itself rather than exiting, so the window it owns never resets. That is the same
  // mechanism UpgradeClients uses, and a separate call because the two differ in what comes back: an
  // upgrade returns to the same session on a newer build, this returns to a different session.
  rpc Switch(SwitchRequest) returns (SwitchResponse);

  // Detach disconnects a session's clients, leaving the session running.
  //
  // The detach key covers the interactive case and cannot cover this one. A key is delivered to
  // whichever client owns the real terminal, which is the outermost one, so from a nested attach it
  // detaches the parent rather than the child. Adding a rule to guess which one the user meant was
  // considered and rejected: the target would depend on server state the user cannot see, so the key
  // would stop meaning one thing.
  //
  // The other caller has no keyboard at all. An agent that started a client had no way to disconnect
  // it, since every existing route to detaching is a keystroke.
  rpc Detach(DetachRequest) returns (DetachResponse);

  // UpgradeClients asks attached clients to replace themselves with the newest binary on disk.
  //
  // Exists because a server restart upgrades the server and nothing else. Shims are deliberately left
  // alone, since replacing one means ending the shell it holds, but a *client* holds nothing: its
  // terminal is the user's, its session is the shim's, and it already knows how to reattach from a
  // recorded position because that is what it does across every server restart. So a client is the one
  // part of cm that can be upgraded without asking anyone to lose work, and it was the one part with no
  // way to do it short of closing the window.
  //
  // Separate from Detach rather than a flag on it, because the two differ in what the caller wants
  // afterwards. A detach ends an attachment; this preserves it and changes what is running underneath.
  // Sharing one RPC would make "did you mean to keep this session on screen" depend on a bool.
  rpc UpgradeClients(UpgradeClientsRequest) returns (UpgradeClientsResponse);

  // Status reports facts about the running server: its pid, how long it has been up, and how many
  // sessions it holds.
  //
  // Separate from Doctor rather than folded into it. Doctor runs fifteen checks, several of which probe
  // every shim over its own socket and scan log files, which is the wrong amount of work for answering
  // "what is running". The two also answer different questions: this reports facts, Doctor reports
  // problems.
  rpc Status(StatusRequest) returns (StatusResponse);

  // Shutdown stops the server, leaving sessions running.
  //
  // Sessions survive by design: each shim owns its pty, so a server that exits leaves every
  // session intact and the next server adopts them. That is the upgrade path, and it needs a way
  // to ask a server to stop that does not involve finding its pid.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

message StatusRequest {}

message StatusResponse {
  // Process id of the server, so it can be found without scanning the process table.
  int32 pid = 1;
  // When the server started, as unix seconds. Sent as a timestamp rather than a duration so the client
  // renders the uptime, which keeps the two from disagreeing as the reply travels.
  int64 started_at_unix = 2;
  // The server's own build.
  string version = 3;
  // Directories in use, which is the fastest way to spot a client talking to a server started with
  // different ones.
  string runtime_dir = 4;
  string state_dir = 5;
  // Session counts by state. Separate fields rather than a map so the shape is fixed and a client does
  // not have to know which keys to expect.
  int32 sessions_running = 6;
  int32 sessions_exited = 7;
  int32 sessions_dead = 8;
  // Clients attached across every session, which says whether anything is watching.
  int32 clients = 9;
  // Whether this server has the terminal emulator. A server without it cannot restore a screen, and
  // that is a property of the server rather than of the client asking.
  bool terminal = 10;

  // What this server can do, as capability tokens from internal/capability.
  //
  // Carried here because Status is the cheapest thing a client can ask, and a client that depends on a
  // server behavior needs to know before it commits rather than after it has waited. `cm wait --until
  // blocked` against a server predating state reporting waits out its whole timeout, since nothing
  // else on the wire separates "not blocked yet" from "will never report blocked".
  //
  // Empty from a server predating this field, which is why every reporting build includes the
  // "capabilities" token itself: an empty list then means "does not speak this" rather than "supports
  // none of these". See capability.Support, whose three values exist for that distinction.
  repeated string capabilities = 11;
}

// ShutdownRequest asks the server to stop.
// ReportedState is what a program in a session says about itself.
//
// Overlaps deliberately with what cm derives from OSC 133, and takes precedence over it: a program that
// says what it is doing knows better than a shell marker does. A coding agent is the case that needs
// this, since its shell reports one long-running command while the agent moves between working, waiting
// for input, and done.
enum ReportedState {
  REPORTED_STATE_UNSPECIFIED = 0;
  // IDLE means the program finished and is not waiting on anything.
  REPORTED_STATE_IDLE = 1;
  // BUSY means it is working.
  REPORTED_STATE_BUSY = 2;
  // BLOCKED means it needs input and will not progress until it gets some.
  //
  // The state OSC 133 cannot express: a shell reports a command as running whether it is computing or
  // sitting at a prompt of its own, so only the program itself can say which.
  REPORTED_STATE_BLOCKED = 3;
  // CLEAR removes a report, so the session falls back to what cm derives from the shell.
  REPORTED_STATE_CLEAR = 4;
}

message ReportRequest {
  // Empty means the session the caller is in, from CM_SESSION.
  string session = 1;
  ReportedState state = 2;
  // A short human-readable note, shown alongside the state. Optional.
  string detail = 3;
  // Who is reporting, for display and so one reporter's state is distinguishable from another's.
  // Optional; free-form.
  string source = 4;
}

message ReportResponse {}

message ReadRequest {
  string session = 1;
  // How many lines from the end. Zero means everything.
  uint32 lines = 2;
  // Return the bytes the program emitted rather than the text they rendered to.
  //
  // Bounded by lines like the plain form, which is what distinguishes this from History's vt format: that
  // renders the whole scrollback and cannot be limited. Ignored together with unwrap, which describes a
  // rendering that raw output does not go through.
  bool raw = 4;
  // Whether to rejoin soft-wrapped lines. A line the terminal broke to fit its width is one line to the
  // program that wrote it, so splitting it puts a newline inside a path or a stack frame.
  bool unwrap = 3;

  // Return output from where the last N commands began, rather than a count of lines.
  //
  // Anchored at the shell's prompt marker, so each block opens with the prompt and the echoed command
  // line. That is what makes reading several commands useful: their outputs run together otherwise, and
  // a caller cannot tell where one ended. Zero means this is not being used.
  //
  // A count of commands rather than a sequence number, deliberately. cm has two sequence-number spaces
  // and mixing them corrupts output, so a number a caller has to hold onto is a hazard; a command count
  // is also what a person and a script actually think in.
  //
  // Mutually exclusive with lines, which is a different bound on the same read.
  uint32 since_commands = 5;

  // Return only the most recent command's own output, with no prompt or echoed command line.
  //
  // The parser's counterpart to since_commands: that produces a transcript, this produces just what the
  // program printed. Well defined for one command only, which is why it is a separate field rather than
  // a mode of the other.
  bool last_output = 6;
}

message ReadResponse {
  bytes data = 1;
}

// WaitState is a condition a caller can wait for.
enum WaitState {
  WAIT_STATE_UNSPECIFIED = 0;
  // IDLE means the shell is at a prompt with no command running, from OSC 133.
  WAIT_STATE_IDLE = 1;
  // BUSY means a command is running.
  WAIT_STATE_BUSY = 2;
  // EXITED means the session ended, whatever its status.
  WAIT_STATE_EXITED = 3;
  // BLOCKED means a program in the session reported that it needs input.
  //
  // Only reachable when something reports it: a shell marks a command as running whether it is computing
  // or waiting at a prompt of its own, so this cannot be derived from OSC 133.
  WAIT_STATE_BLOCKED = 4;
}

message WaitRequest {
  string session = 1;
  WaitState until = 2;
  // Wait until this text appears in the session's output, instead of waiting for a state.
  //
  // The only wait that needs nothing from what is running. Every state cm can wait for comes from OSC 133
  // or from a program calling Report, so a session running something with neither -- which is most
  // programs -- could previously only be polled, and a polling loop can miss output that scrolls past
  // between samples. That is exactly what a server-side wait exists to avoid.
  //
  // A plain substring, not a pattern. Matched against the rendered text by default, so escape sequences
  // between the characters do not defeat it: a program that colours its output writes "DO\x1b[0mNE", and a
  // caller means the DONE they would see.
  //
  // Mutually exclusive with until, which is refused rather than combined: "idle and also matching" and
  // "idle or matching" are both plausible readings of the pair, so neither is assumed.
  string match = 11;
  // Match the bytes the program emitted rather than the text they rendered to.
  //
  // For the case where the escape sequences are what is being looked for. Changes whether a pattern can
  // match at all rather than how anything is displayed, so it is a deliberate modifier.
  bool match_raw = 12;
  // How long to wait before giving up. Zero waits indefinitely.
  //
  // Milliseconds rather than a duration string: this crosses a wire, and an integer needs no parser on
  // either side.
  uint64 timeout_ms = 3;
}

message WaitResponse {
  // Whether the condition was reached, as opposed to the wait timing out.
  bool satisfied = 1;
  // What a program in the session reported about itself, if anything, and the note that came with it.
  string reported_state = 6;
  string reported_detail = 7;
  // The session's state when the wait returned, so a caller that timed out learns what it was instead.
  bool busy = 2;
  string command = 3;
  // Exit status of the last finished command, and whether there was one.
  //
  // Carried here so `cm wait --until idle` answers "did it work" in the reply that says "it finished",
  // rather than requiring a second call that races the next command starting.
  int32 last_command_exit_code = 8;
  bool command_finished = 9;
  SessionState state = 4;
  int32 exit_code = 5;
  // How much of the session's output the server had consumed when the wait returned.
  //
  // A follower needs this to know when it has caught up. The wait says the command finished, which is not
  // the same as its output having reached the client: bytes are still in flight over the stream, and a
  // caller that stops following the moment the wait returns truncates them. `cm run` on a reused session
  // lost the command's output that way about a third of the time.
  uint64 last_seq = 10;
}

message DoctorRequest {
  // Act on the fixable findings rather than only reporting them.
  bool repair = 1;
  // The calling client's build, so the server can report a mismatch with its own.
  //
  // Sent by the client rather than derived server-side, because that is the only place it is knowable: the
  // server cannot tell which binary connected to it. Empty from a client that predates this field, which
  // is itself a version difference worth reporting.
  string client_version = 2;

  // What the calling client can do, beside its version, for the same reason: only the client knows.
  //
  // This lets a diagnostic say what differs rather than only that builds differ, which is the gap the
  // version fields leave. It also lets it say which side is *ahead*: a token the server does not
  // recognize means the client is newer, and nothing else cm reports distinguishes a stale server from a
  // stale client.
  //
  // Reported, never acted on. The server branches on no client capability, and if it ever needs to, the
  // token for that gets added with the branch.
  repeated string client_capabilities = 3;
}

message DoctorResponse {
  repeated Finding findings = 1;
  // What a repair did, empty when repair was not requested.
  repeated string repaired = 2;
  // The server's own build, so a client can show both sides of a mismatch.
  string server_version = 3;
  // What this server can do, so `cm version` can list it from the call it already makes.
  //
  // Duplicated from StatusResponse deliberately: these are the two things a client asks when it wants to
  // know what it is talking to, and a client should not have to make both calls to find out.
  repeated string server_capabilities = 4;
}

// Finding is one thing wrong with an installation.
message Finding {
  // A stable string rather than an enum, so a script matching on it keeps working as kinds are added:
  // "orphan-shim", "stale-socket", "missing-shim".
  string kind = 1;
  string session = 2;
  string socket = 3;
  // Set when a shim answered and reported them.
  int32 shim_pid = 4;
  int32 shell_pid = 5;
  string detail = 6;
  bool fixable = 7;
}

message ShutdownRequest {}

// ShutdownResponse confirms the server is stopping.
message ShutdownResponse {}

// AttachRequest is a client-to-server event. The first message on the stream must be an
// Open; everything after it is input, a resize, or a detach.
message AttachRequest {
  oneof event {
    Open open = 1;
    Input input = 2;
    Resize resize = 3;
    Detach detach = 4;
  }
}

message Open {
  // Session to attach to. Empty asks the server to allocate a unique name, which is how
  // a terminal emulator creates a per-window session without inventing names itself.
  string session = 1;

  // Initial window size.
  uint32 rows = 2;
  uint32 cols = 3;
  uint32 x_pixel = 4;
  uint32 y_pixel = 5;

  // Resume output from this sequence number instead of restoring screen state. Set by a
  // client reconnecting after the server restarted: its terminal still shows the session,
  // so it wants the bytes it missed, not a fresh repaint. Absent on a first attach.
  optional uint64 resume_from_seq = 6;

  // Field 7 was `own`, which ended the session when this client's connection dropped without a
  // Detach. Removed rather than reused: see docs/architecture.md for why a server-side flag cannot
  // express per-window lifetime.
  reserved 7;

  // Attach without sending input or affecting sizing: a read-only follower.
  bool read_only = 8;

  // Skip the screen repaint that normally opens an attachment, streaming only what happens from now on.
  //
  // For a follower that is not painting a terminal. An interactive client wants the repaint, since it has to
  // fill an empty window with the session's current screen. Something piping output to a file wants the
  // opposite: the repaint duplicates whatever it has already printed, which is exactly what
  // `cm read --follow` produced before this existed -- the last lines twice, once rendered and once as part
  // of the restored screen.
  bool no_restore = 16;

  // Command to run instead of the user's shell. Only meaningful when creating.
  repeated string command = 9;

  // Working directory for a newly created session. Empty means the client's cwd.
  string cwd = 10;

  // Environment variables to set for a newly created session, as KEY=VALUE.
  repeated string env = 11;

  // Terminal-related variables from this client's own environment, as KEY -> VALUE.
  //
  // Recorded on every attach, not just creation. A shell in a long-lived session holds values
  // describing the terminal that started it, and reattaching from a new terminal, or the same
  // one after it restarted, makes those stale. kitty's KITTY_LISTEN_ON is the sharp case, since
  // every kitten call goes through it.
  //
  // Distinct from env above, which sets variables for a shell being created. These are recorded
  // for an existing shell to ask about later.
  map<string, string> client_env = 12;

  // Persist requests that this session's content survive a reboot, regardless of whether its name
  // matches the server's configured patterns.
  bool persist = 13;

  // OnRestore overrides the server's configured behavior when reviving this session: "shell",
  // "none", or "command". Empty means the configured default.
  //
  // A string rather than an enum because it is a per-session override of a config value that is
  // also a string, and keeping one spelling avoids two vocabularies for the same setting.
  string on_restore = 14;

  // CaptureOutput saves this session's output so it can be read after the session ends, without
  // asking for reboot survival.
  //
  // Distinct from persist because the two differ in how long the session is kept, not in mechanism.
  // `cm run` sets this so `cm history` works once the command has exited, while leaving the session
  // eligible for prompt cleanup rather than the week a persisted session is kept.
  bool capture_output = 15;

  // Tags to attach to a newly created session. Ignored when attaching to one that exists, since an
  // attach is not how tags are changed; Tag is.
  map<string, string> tags = 17;

  // The session this client is itself running inside, when it is running inside one.
  //
  // Set from CM_SESSION by an interactive client whose terminal is a cm session's pty, which is
  // what a nested attach is. Empty for a client attaching from a real terminal, and for one whose
  // output is a pipe or a file, since neither is a session hosting anything.
  //
  // The server needs this because it cannot work the relationship out from the bytes. A nested
  // client's stdout *is* the parent's pty, so the child's OSC 7, OSC 2, OSC 133, and cm's own
  // report all arrive on the parent's stream indistinguishable from the parent shell's own. The
  // parent server then recorded them as facts about itself: `cm list` showed the child's directory
  // and title against the parent, the values reached the store and so survived a restart, and a
  // `cm wait` on the parent was satisfied by a report the child made. Verified in a sandbox, with
  // lsof confirming neither shell had actually changed directory.
  //
  // Naming the parent rather than sending a bare "I am nested" flag, because the server has to
  // find that session to act on it, and a flag would leave it guessing which of its sessions the
  // client's terminal belongs to.
  string inside_session = 18;

  // This client's build and process id, so a listing can name the clients attached to a session.
  //
  // Added because diagnosing a session loss meant working out what was attached from `ps` and lsof,
  // matching binary inodes by hand. The server knew a *count* of clients and nothing about any of
  // them. A shim outlives servers by design, so a running install legitimately spans many builds:
  // one incident had twelve distinct builds across twenty-six shims, and telling which client was
  // which took longer than reading the logs.
  //
  // Both are advisory and neither is trusted for anything. The pid is only meaningful on the same
  // host, which is where clients are, and version is whatever the client says. An old client sends
  // neither, and empty is reported as unknown rather than guessed at.
  string client_version = 19;
  int32 client_pid = 20;

  // Questions this client was handed and has not answered, re-offered when it reconnects.
  //
  // cm proxies a terminal-only query to one client and records it as outstanding, so the reply coming back
  // can be matched to the question that asked. Those records live in the server's memory, and adoption
  // resubscribes from where the old server stopped, so a restart forgets the question and does not re-ask
  // it: the reply then matches nothing and is discarded, and the asking program gets no answer.
  //
  // The client is the only thing that still knows, because it was handed the bytes and wrote them to its
  // terminal. So it re-offers them here and the server records them again.
  //
  // This does not let a client answer for itself, which is the invariant that matters: cm remains the only
  // writer of a reply to the pty, still matches a reply against a recorded question, and still asks one
  // client at a time. What a client gains is the ability to have bytes it sends treated as a reply rather
  // than as typing, and it can already send typing, which reaches the pty verbatim.
  //
  // Advisory. An older client sends none and behaves as it did.
  repeated bytes outstanding_queries = 22;
}

// AttachedClient describes one client attached to a session.
//
// Reported so `cm list --json` can say what is attached rather than only how many things are, which
// is what a version-skew investigation needs and what a bare count cannot give.
message AttachedClient {
  // Process id as the client reported it, or zero from a client too old to send one.
  int32 pid = 1;
  // The client's build, or empty from a client too old to send it. Compare against the server's own
  // version in StatusResponse: a difference is legal here, since cm is built for a client and server
  // from different builds, but it is worth being able to see.
  string version = 2;
  // Whether this client attached read-only, which is a follower rather than a terminal.
  bool read_only = 3;
  // When this client attached, as unix seconds.
  int64 attached_at_unix = 4;
  // When this client last sent typing, as unix seconds, or zero if it never has.
  int64 last_input_at_unix = 5;
  // Whether this is the client someone is using: the one that typed most recently. At most one client
  // per session has it, and none does before anything is typed or when two timestamps tie.
  //
  // Decided by the server rather than by comparing last_input_at_unix here, because it needs every
  // client's timestamp at once and a caller holding one message cannot see the others.
  //
  // Typing is the signal because nothing else can single out one client. A session's pty fans out to
  // every attached client, so a query asking "which client are you" is answered by all of them, and cm
  // only learns about focus when the program inside the session enabled DECSET 1004. A keystroke
  // arrives on exactly one attach stream.
  bool active = 6;
}

message Input {
  bytes data = 1;
}

message Resize {
  uint32 rows = 1;
  uint32 cols = 2;
  uint32 x_pixel = 3;
  uint32 y_pixel = 4;
}

// Detach ends this client's attachment without terminating the session. Sending it explicitly is
// what distinguishes leaving a session from losing the connection, which the server records.
message Detach {
  // The client will exit without reading the acknowledgement, so do not send one.
  //
  // Every client sets this now: nothing waits for the reply, because nothing depends on the Detach
  // arriving. It reads as vestigial and is not. The field is what keeps a warning out of the server's
  // log for a client whose connection is closing as its Detach goes out -- `cm run -d`,
  // `cm attach --no-attach`, and an interrupted follower all lose that race about 40% of the time, and
  // warning about intended behavior made `cm doctor` report a healthy installation as having a problem.
  //
  // Kept as a field rather than assumed, so a future client that does want confirmation can ask without
  // reviving the protocol. See docs/architecture.md for what the acknowledgement originally protected.
  bool no_ack = 1;
}

// AttachResponse is a server-to-client event.
message AttachResponse {
  oneof event {
    Opened opened = 1;
    Output output = 2;
    Exited exited = 3;
    Metadata metadata = 4;
    Detached detached = 5;
    Query query = 6;
  }
}

// Query asks this client's terminal a question the server cannot answer itself.
//
// The background colour, the palette, the clipboard, and the window's pixel size all live in the
// terminal rather than in a terminal model, so a program inside a session that asks for one can only be
// answered by a real terminal. The server relays the question to exactly one client and matches the reply
// it sends back, which is what keeps one question to one answer.
//
// Deliberately not sent as ordinary output. Output fans out to every attached client, so a question sent
// that way would be asked of every terminal and each would answer, and it would also appear in the
// session's scrollback as though the shell had printed it. This carries it to one client and stays out of
// the session's recorded bytes.
//
// A client writes these to its terminal and lets the reply travel back on the normal input path, where
// the server recognizes it as a query reply. A client that cannot answer, such as a read-only follower,
// is never sent one.
message Query {
  // The escape sequence to write to the terminal, exactly as the program in the session sent it.
  bytes data = 1;
}

// Detached confirms the server processed a client's Detach.
//
// A client must wait for this before exiting. Sending Detach and returning immediately does not work:
// the send is asynchronous, so the connection is torn down before the message is transmitted, and the
// server then sees a client that vanished without detaching. For an owned session that means being
// destroyed, which is the opposite of what detaching asks for.
message Detached {
  // Asks the client to come back on a newer build rather than exit.
  //
  // A plain Detached means the client is done, so it returns to the shell that started it. With this
  // set, the client is expected to replace itself with the newest binary on disk and reattach to the
  // same session from where it left off, which is what makes a client upgrade look like the brief
  // freeze a server restart already looks like.
  //
  // A flag on the existing event rather than a new one, because everything else about the two is
  // identical: the server stops streaming, closes the stream, and leaves the session running. A client
  // too old to understand this field reads the message as an ordinary detach and exits, which is a
  // worse outcome than upgrading but not a broken one, and it is the reason `cm client upgrade` reports
  // which clients it asked.
  bool upgrade = 1;

  // Asks the client to come back attached to a different session, named by this reference.
  //
  // Set by Switch, which is how a terminal window is pointed at another session without closing it.
  //
  // Sent on the same event as upgrade because both are the server saying "stop reading this session", and
  // a client acts on them differently. An upgrade replaces the process, since the point is to run a
  // different binary. A switch does not: the client reattaches inside its own process, which keeps its
  // terminal, its process id, and the command `ps` shows for it, and reuses the loop it already runs
  // whenever a server restarts.
  //
  // It must not resume from its recorded position either way. That position counts bytes in the old
  // session's stream, and a resume against a different session asks for a place its log does not have,
  // which slices the front off whatever escape sequence lands at the boundary. Switching repaints from
  // the new session's screen instead.
  //
  // A reference rather than an ID, because which one is meant depends on the switch. An ordinary switch
  // sends an ID, so the client lands on exactly the session asked for. A switch that rebound this
  // window's own name sends that name, which can still recreate the session if it has gone in the
  // meantime, where an ID would only fail.
  string switch_to = 2;
}

// Metadata reports what the shell has said about itself, so a client can act on it.
//
// A terminal emulator needs this: retitling a tab, or opening a new window in the session's
// directory, requires knowing values that the shell reported to the multiplexer rather than to the
// terminal. Sent on attach and whenever a value changes.
message Metadata {
  string title = 1;
  // Working directory, decoded from OSC 7 rather than the raw URI the shell sent.
  string cwd = 2;
  // Whether cwd exists on the client's machine. False once a session has ssh'd elsewhere, in
  // which case acting on the path locally is wrong.
  bool cwd_is_local = 3;

  // Whether a command is running, and which one, from OSC 133. See the same fields on Session.
  //
  // Forwarded as an event rather than left to polling so a terminal emulator can react as it happens,
  // which is the difference between a tab that shows what is running and one that shows it a second
  // later.
  bool busy = 4;
  string command = 5;
  // Exit status of the last finished command, and whether there was one. See Session for why these are
  // separate from the session's own status.
  int32 last_command_exit_code = 9;
  bool command_finished = 10;
  // What a program in the session reported about itself, which takes precedence over busy above.
  string reported_state = 6;
  string reported_detail = 7;
}

message Opened {
  // What to call this session when talking to a person: the name it was attached by, or "@" plus its ID
  // when it has no name. What a client prints in "detached from ...".
  //
  // Not what to hold on to. A name is a binding and can be pointed elsewhere while this client is
  // attached, so anything that comes back to this session later must use session_id.
  string session = 1;
  // The session's identity, which is what a client should use for every later call about it.
  //
  // Needed even when the client supplied a name: `cm run` polls for its session to finish, and polling
  // by name would find a different session if the name moved, or none at all when there was no name to
  // begin with.
  string session_id = 5;
  // Whether this call created the session.
  bool created = 2;
  // Bytes to write to the terminal before streaming output: either serialized screen
  // state on a fresh attach, or nothing when resuming.
  bytes restore = 3;
  // Sequence number the following output stream starts at. A client tracks this so it can
  // resume from the right place after a reconnect.
  uint64 next_seq = 4;
}

message Output {
  uint64 seq = 1;
  bytes data = 2;
  // Set when output was truncated before the requested sequence, so the client knows its
  // view has a hole and should reattach fresh rather than assume continuity.
  bool gap = 3;
}

// Exited reports that the session's shell exited, so the client should stop rather than
// try to reconnect.
message Exited {
  int32 exit_code = 1;
}

message SignalRequest {
  string session = 1;
  // Signal number, as in signal(3). A number rather than an enum because the set is
  // platform-defined: enumerating it here would mean either a list that disagrees with the host or a
  // second vocabulary for something the operating system already names.
  int32 signal = 2;
  // Send to the shell's process group rather than the shell alone.
  //
  // Defaults to the group when unset, since that is what a keypress does: the pty delivers to the
  // foreground process group, so a signal reaching only the shell would leave the job a caller meant
  // to stop still running. process_only opts out for the rare case of signalling the shell itself.
  bool process_only = 3;
}

message SignalResponse {}

message TagRequest {
  // Empty means the session the caller is in, from CM_SESSION.
  string session = 1;
  // Tags to set, replacing any existing value for the same key. A key with an empty value is a
  // valid tag, so this cannot express removal; remove does.
  map<string, string> set = 2;
  // Keys to remove. A key that is not present is not an error, since the caller's intent is
  // satisfied either way.
  repeated string remove = 3;
  // Discard every existing tag before applying set, so a caller can define the whole set rather
  // than editing it.
  bool replace = 4;
}

message TagResponse {
  // The session's tags after the change, so a caller does not need a second call to see the result.
  map<string, string> tags = 1;
}

message DetachRequest {
  // Sessions whose clients to disconnect. Repeated to match Kill, so one call can clear several.
  repeated string sessions = 1;
}

message DetachResponse {
  // How many clients were disconnected, keyed by session name.
  //
  // A count rather than a bool, because a session can have several clients and "detached" would not say
  // whether one or four windows just let go. Zero is a normal answer rather than an error: asking a
  // session with nothing attached to detach is already satisfied, which is what makes this safe to call
  // without checking first.
  map<string, uint32> detached = 1;
  // Sessions that could not be detached, keyed by name. Shaped like KillResponse.errors.
  map<string, string> errors = 2;
}

message UpgradeClientsRequest {
  // Sessions whose clients to upgrade. Empty means every session, since upgrading one window and
  // leaving the rest is rarely what a caller wants after installing a new build.
  repeated string sessions = 1;

  // Ask clients already running this build to re-exec anyway.
  //
  // Off by default, so upgrading is idempotent and running it twice does not make every window blink
  // for no reason. On, it is a way to restart clients without changing the binary, which is the shape of
  // "pick up a config change".
  bool force = 2;

  // Ask only the active client of each named session, rather than every client attached to it.
  //
  // This is what an upgrade bound to a keybinding wants. Without it the only way to upgrade the window
  // you are in is to name its session, which asks every client attached to that session, so upgrading
  // one window repaints the others.
  //
  // A session whose active client cannot be identified is left alone and reports zero asked, rather
  // than falling back to upgrading everything. Guessing here would make the flag mean "one client,
  // usually" and repaint windows a caller explicitly asked to spare.
  bool active_only = 3;
}

message UpgradeClientsResponse {
  // How many clients were asked, keyed by session name.
  //
  // Asked rather than upgraded, and the distinction is honest rather than pedantic: the server sends the
  // request and closes the stream, so whether a client comes back is something only the client knows. A
  // client too old to understand the request exits instead of returning, which is why this counts what
  // was sent rather than claiming an outcome.
  map<string, uint32> asked = 1;
  // Clients skipped because they already run the server's build, keyed by session name. Absent when
  // force is set, since nothing is skipped then.
  map<string, uint32> already_current = 2;
  // Sessions that could not be reached, keyed by name. Shaped like KillResponse.errors.
  map<string, string> errors = 3;
}

message ListRequest {
  // Only sessions whose name matches this prefix. Empty matches all.
  string prefix = 1;
  // Only sessions carrying all of these tags, as "key" or "key=value". A bare key matches whatever
  // its value is.
  //
  // Repeated terms narrow rather than widen: a caller asking for two tags wants the sessions that
  // have both. There is deliberately no negation or set membership, which would be more selector
  // grammar than filtering tens of sessions justifies and can be added later without changing this.
  //
  // Strings rather than a map so a bare key is expressible: a map entry with an empty value cannot
  // distinguish "has this key" from "has this key set to empty".
  repeated string tags = 2;
}

message ListResponse {
  repeated Session sessions = 1;
}

// SessionState is a session's lifecycle stage.
enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  // The session has a live shim holding a running shell.
  SESSION_STATE_RUNNING = 1;
  // The shell exited, and exit_code says with what.
  SESSION_STATE_EXITED = 2;
  // The shim could not be reached. Distinct from exited because the outcome is unknown rather
  // than observed, so exit_code means nothing.
  SESSION_STATE_DEAD = 3;
}

message Session {
  // What to call this session when talking to a person: one of its names, or "@" plus its ID when it
  // has none.
  //
  // Kept as field 1 under its old name because that is what every caller displays, and it still answers
  // the same question. What changed is that it is no longer an identity: use id to refer to this
  // session, since a name can be pointed at a different one at any time.
  string name = 1;

  // The session's identity: allocated when it is created, never reused, and never changed.
  //
  // Anything holding on to a session across calls should hold this. A name is a binding, so the name a
  // listing showed a moment ago may now resolve elsewhere, while an ID either finds the same session or
  // finds nothing.
  string id = 22;

  // Every name bound to this session, oldest first.
  //
  // Repeated because a session can have several, which is what makes a terminal window's automatic name
  // and a name a person chose able to coexist on one session. Empty for a session nothing names, which
  // is normal: `cm attach` with no name and `cm run -d` both produce one.
  repeated string names = 23;
  int32 shell_pid = 2;
  // Number of attached clients.
  uint32 clients = 3;
  // Working directory, as reported by the shell via OSC 7. May be empty if the shell
  // does not report it.
  string cwd = 4;
  // Whether cwd is on this host. A session that has ssh'd elsewhere reports a path that
  // does not exist locally, so acting on it, such as opening a new window there, is
  // wrong.
  bool cwd_is_local = 5;
  string title = 6;
  int64 created_at_unix = 7;
  bool exited = 8;
  int32 exit_code = 9;

  // Lifecycle stage. Preferred over exited, which cannot distinguish a shell that exited from a
  // shim that vanished; exited remains for compatibility.
  SessionState state = 10;
  // Working directory as the shell reported it, which is a URI for OSC 7 and keeps the host, so a
  // caller can tell a remote directory from a local one. cwd holds the decoded local path.
  string cwd_uri = 11;

  // What a program in the session reported about itself, if anything: "idle", "busy", or "blocked".
  //
  // Empty when nothing has reported, in which case busy below is what cm derived from the shell. When
  // both are present this one wins, since a program describing itself is better evidence than a shell
  // marker.
  string reported_state = 14;
  // The note that came with the report, and who sent it. Both optional and free-form.
  string reported_detail = 15;
  string reported_source = 16;
  // When the report was made, in seconds since the epoch. Zero when nothing has reported, and zero
  // from a server that predates this field.
  //
  // Worth sending because a report is the program's last word rather than a live reading: it stands
  // until the program says otherwise, and it survives a server restart, so "blocked" alone cannot
  // distinguish a program waiting on an answer now from one that said so hours ago.
  int64 reported_at_unix = 24;

  // Whether a command is running, as opposed to the shell sitting at a prompt, from OSC 133.
  //
  // A terminal emulator needs this to decide whether closing a window is destructive: the shell owns
  // the pty, so kitty only ever sees `cm attach` running and cannot tell a busy session from an idle
  // one. False for a shell with no OSC 133 support, since nothing then reports otherwise.
  bool busy = 12;
  // The command line the shell reported running, when it reported one.
  //
  // Best effort: the cmdline parameter is an extension that zsh and bash send under kitty's shell
  // integration and other shells omit, so this can be empty while busy is true.
  string command = 13;

  // Exit status of the last command the shell finished, from OSC 133;D.
  //
  // Distinct from exit_code above, which is the *session's* own status: that says whether the shell
  // itself has gone, this says whether the last thing it ran succeeded. Conflating them would report a
  // failed build as a dead session.
  //
  // command_finished is what makes the value readable, since zero is a real exit status and cannot
  // double as "nothing has finished yet". False for a shell whose integration omits the status
  // parameter, which is legal: kitty's zsh integration sends `133;D;<status>` while a bare `133;D`
  // carries none.
  int32 last_command_exit_code = 17;
  bool command_finished = 18;

  // The caller's own key/value labels for this session.
  //
  // Persisted for the session's whole life, including across a reboot restore. A report is persisted
  // too, but only as a handover between servers: it describes a program, so it is dropped once the
  // evidence says that program has gone, while a tag describes the session and always survives.
  //
  // cm never interprets a key. There is no tag that changes how a session is treated, because
  // inferring meaning from one would be the same mistake as scraping a screen to work out what is
  // running.
  map<string, string> tags = 19;

  // Sessions currently attached from inside this one, by a nested `cm attach`.
  //
  // Present so a listing can say why this session's own reported values are standing still: while
  // it hosts a nested attach its shell is blocked inside `cm attach` and reports nothing, so its
  // title and directory are its last true ones rather than stale ones.
  //
  // Repeated because one session can host several at once, in sequence or in split panes of
  // whatever is running inside it. Not persisted: this describes two live attachments, and a stored
  // value would come back after a restart claiming a nesting that ended with the previous server.
  repeated string hosting = 20;

  // The clients attached right now, one entry each.
  //
  // Alongside the count above rather than replacing it: clients is what a status line wants and is
  // cheap, while this is what a diagnosis wants. Not persisted, for the same reason hosting is not.
  // An attachment is live state, and a stored one would come back after a restart describing a
  // client that left with the previous server.
  repeated AttachedClient attached_clients = 21;
}

message KillRequest {
  repeated string sessions = 1;
  // Remove the session record even if its shim cannot be reached, and end the session with SIGKILL
  // rather than SIGHUP.
  //
  // Without the first, an unreachable shim is left alone: it may be busy rather than dead, and
  // discarding the record would orphan it permanently. The second half is what makes the flag mean "be
  // maximally forceful", so a caller that has decided a session must go does not need two flags to say
  // it.
  bool force = 2;
  // Signal to end the session with, overriding the default.
  //
  // Zero means SIGHUP, or SIGKILL when force is set. Exists because the default is a request rather
  // than a guarantee: a job that ignores SIGHUP survives it, and `cm kill` then reports success having
  // left a process holding a pty. A caller that knows what it is stopping can name the signal instead
  // of reaching for force, which also discards bookkeeping.
  //
  // A number rather than an enum, for the same reason SignalRequest uses one: the set is
  // platform-defined.
  int32 signal = 3;
}

message KillResponse {
  repeated string killed = 1;
  // Sessions that could not be killed, keyed by name.
  map<string, string> errors = 2;
  // Sessions whose processes survived the signal, keyed by name, with the pids still alive.
  //
  // Reported rather than folded into errors, because the kill did not fail: the session is gone from cm's
  // view and the record is deleted. What is left is a process holding a pty that nothing will reattach
  // to, which is a warning about a leak rather than a failed request.
  //
  // Empty is also what an older shim reports, so this cannot distinguish "nothing survived" from "the
  // shim does not check". That only ever costs a warning, which is why it needs no capability probe.
  map<string, SurvivingProcesses> surviving = 3;

  // References that released a name instead of killing anything, with the session each one had pointed
  // at.
  //
  // A name records what killing by it means, because the caller is usually a terminal emulator's
  // window-close watcher: it fires for every window and cannot know whether that window is where a
  // session lives or borrowed it from elsewhere. A borrowed name releases and the session keeps running,
  // which is the session equivalent of detaching.
  //
  // Reported separately from killed rather than folded into it, since "your session is gone" and "this
  // window let go of a session that is still running" are answers a caller must be able to tell apart.
  map<string, string> unbound = 4;
}

// SurvivingProcesses lists pids that outlived a signal.
message SurvivingProcesses {
  repeated int32 pids = 1;
}

message SwitchRequest {
  // The session whose client should switch, as a name or an "@id". This is the window's current session,
  // which a command running inside it reads from CM_SESSION.
  string session = 1;
  // The session to switch to, as a name or an "@id".
  string target = 2;
  // Point this session's name at the target as well, so the switch survives the terminal restarting.
  //
  // Without it the switch lasts as long as the client. A terminal emulator's launch command is fixed when
  // the window is created and saved verbatim, so on restore the window re-runs that command and comes
  // back to the session it originally made. Binding the name it uses is the only thing that changes where
  // that lands.
  //
  // The name bound is the one this session is known by. A session with no name has nothing to bind, and
  // the call says so rather than silently switching for this client only.
  bool bind = 3;
  // End the session the name is being moved off, once the windows have left it.
  //
  // Only with bind, because a switch leaves the name pointing at that session: ending it would leave the
  // name resolving to nothing.
  bool replace = 5;

  // Replace even when the session being ended is running something.
  bool force = 6;

  // The session the caller is itself running in, from CM_SESSION, or empty.
  //
  // Needed for one decision the server cannot make alone: whether to check that the session being ended is
  // busy. A rebind typed inside that session *is* the busy command, since OSC 133 reports a foreground
  // command and this is one, so the check would refuse every time and mean nothing. It is worth making when
  // the caller is somewhere else, where a foreground command really is somebody else's work.
  string caller_session = 7;

  // Switch every client of the session rather than only the one someone is using.
  //
  // Off by default: a switch is about one window, and the active client is the one that typed the command
  // that asked for it, which is causally the right window. Several clients on one session are separate
  // windows, and moving all of them because one asked is the opposite of the request.
  bool all_clients = 4;
}

message SwitchResponse {
  // How many clients were asked to switch. Zero when no active client could be named, which happens when
  // nothing has been typed in the session since a client attached.
  uint32 asked = 1;
  // The session switched to, and the reference the clients were given.
  string target_id = 2;
  string switched_to = 3;
  // The name that was rebound, empty when bind was not asked for.
  string bound_name = 4;

  // The session that was ended, empty when none was.
  string killed_session = 5;

  // Why the session was left running when replace was asked for, empty otherwise.
  //
  // Reported rather than silently skipped: a caller that asked for the old session to go needs to know it
  // is still there, and why, since every reason is something they can act on.
  string kept_reason = 6;
}

message BindRequest {
  // The name to bind. Not a reference: an ID cannot be bound to anything, since it is what names point at.
  string name = 1;
  // The session to point it at, as a name or an "@id" reference.
  string session = 2;
  // Allow repointing a name that already names something.
  //
  // Off by default because the two intents are far apart and only one of them is reversible by accident.
  // Naming a session is ordinary; quietly taking a name off the session a terminal window is watching is
  // how that window comes back somewhere its user did not put it.
  bool move = 3;
  // Whether killing by this name releases the name instead of killing the session.
  //
  // For a name pointed at a session that already existed, where the window using it is a borrower rather
  // than its home. Off by default, because `cm kill <name>` killing the session is what it has always
  // meant.
  bool borrow = 4;
}

message BindResponse {
  // The session the name now points at, so a caller sees what it got rather than what it asked for.
  string session_id = 1;
  // What the name pointed at before, empty when it pointed at nothing. A caller that passed move needs to
  // be able to say what moved.
  string previous_session_id = 2;
}

message UnbindRequest {
  string name = 1;
}

message UnbindResponse {
  // Whether a name was actually removed. False means nothing was bound, which is not an error: the
  // caller wanted the name gone and it is.
  bool removed = 1;
  // The session it had pointed at, for a caller reporting what was released.
  string session_id = 2;
}

message SendRequest {
  string session = 1;
  bytes data = 2;

  // Wait for a state after delivering the input, in the same request.
  //
  // One request rather than a send followed by a wait, because the two cannot be ordered from outside:
  // a command that finishes before the second call arrives leaves the caller waiting for a transition
  // that already happened. The server arms the wait before it writes the input, so there is no window.
  WaitState wait_until = 3;
  uint64 wait_timeout_ms = 4;

  // Wait until this text appears in the session's output, instead of waiting for a state.
  //
  // The reason to have it here rather than only on Wait is the same reason wait_until is here: the
  // subscription is armed before the input is written, so a command that prints and finishes faster than a
  // second call could arrive is still caught. A caller composing `send` with a separate
  // `wait --match` has to start the wait first and cannot close that window from outside.
  //
  // Matters most for a session whose shell reports no OSC 133, where wait_until has nothing to resolve on:
  // reusing such a session could previously only be bounded by a timeout, which is a sleep rather than a
  // wait.
  //
  // Mutually exclusive with wait_until, refused rather than combined.
  string match = 5;
  // Match the bytes the program emitted rather than the text they rendered to. See WaitRequest.match_raw.
  bool match_raw = 6;

  // The submitting keypress, written as its own pty write after data rather than appended to it.
  //
  // Separate because a pty read returns at most 1022 bytes, so one large write arrives as several reads:
  // 1201 bytes came back as [1022, 179]. A full-screen program doing paste detection sees that burst as a
  // paste and consumes a trailing CR as pasted content rather than as the key that submits it. Measured
  // against a real Claude Code session, varying only length: 42 bytes submitted, 121 and 281 bytes landed
  // in its input box without submitting, and 842 bytes did not appear until a separate enter arrived.
  //
  // A field rather than the client making two Send calls, because the wait has to be armed around both
  // writes. Two calls would arm it after the text, and the command starts on the CR.
  bytes enter = 7;
}

message SendResponse {
  // Whether the session has ever reported a command via OSC 133, at the moment the input was sent.
  //
  // Reported so a client can warn that a wait may never resolve. It has to come from the server: the signal is
  // a monotonic counter of commands seen, and the fields a client can already read -- busy, and the current
  // command -- are cleared once a command finishes, so a fast one leaves nothing behind. That is the same trap
  // the counter was introduced for.
  bool shell_reports = 3;
  // Present only when wait_until was set. Reports the same thing Wait does.
  WaitResponse wait = 1;
}

// HistoryFormat selects how session contents are rendered.
enum HistoryFormat {
  // Plain text, suitable for piping to a file or a pager.
  HISTORY_FORMAT_UNSPECIFIED = 0;
  // Escape sequences, preserving colors and styling.
  HISTORY_FORMAT_VT = 1;
  // HTML, preserving styling.
  HISTORY_FORMAT_HTML = 2;
}

message HistoryRequest {
  string session = 1;
  HistoryFormat format = 2;
}

message HistoryResponse {
  bytes data = 1;
}

message GetEnvRequest {
  string session = 1;
}

message GetEnvResponse {
  // Variables the latest client reported, as KEY -> VALUE.
  map<string, string> env = 1;
}
