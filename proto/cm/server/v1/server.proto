syntax = "proto3";

// Package cm.server.v1 is the interface clients use. The server is the only entry point:
// clients never talk to a shim directly.
//
// Unlike the shim API, this surface may evolve. A client and server are upgraded
// together, and a client that meets an incompatible server can simply refuse to attach
// with a clear message.
package cm.server.v1;

option go_package = "github.com/chancez/cm/proto/cm/server/v1;serverv1";

service Server {
  // Attach connects a terminal to a session, creating the session if needed. The stream
  // is bidirectional and long-lived, and carries both input and control events such as
  // resize so their ordering relative to keystrokes is preserved.
  rpc Attach(stream AttachRequest) returns (stream AttachResponse);

  // List reports known sessions.
  rpc List(ListRequest) returns (ListResponse);

  // Kill terminates sessions and their shells.
  rpc Kill(KillRequest) returns (KillResponse);

  // Send writes bytes to a session's shell without attaching to it.
  rpc Send(SendRequest) returns (SendResponse);

  // History returns a session's contents, scrollback included, for printing or piping.
  rpc History(HistoryRequest) returns (HistoryResponse);

  // GetEnv returns the environment variables the session's most recent client reported.
  //
  // A shell inside a session cannot learn these any other way: nothing outside a process can
  // change its environment, so the shell has to ask and apply the result itself.
  rpc GetEnv(GetEnvRequest) returns (GetEnvResponse);

  // Report records what a program in a session says it is doing.
  //
  // Deliberately not agent-specific: cm has no notion of an agent, and a state a program reports is
  // just a state. A build script, a test runner, and a coding agent's hook all use the same call.
  rpc Report(ReportRequest) returns (ReportResponse);

  // Read returns a bounded, parseable view of a session's recent output.
  //
  // Distinct from History, which renders everything: a caller reading a session programmatically wants
  // the tail, with soft-wrapped lines rejoined so a path broken to fit the terminal is one line again.
  rpc Read(ReadRequest) returns (ReadResponse);

  // Wait blocks until a session reaches a state, so a caller can sequence work without polling.
  //
  // Server-side rather than a client loop: the server already watches the output stream, so it can
  // answer from an event instead of a caller sampling `list` and racing the transition it wanted.
  rpc Wait(WaitRequest) returns (WaitResponse);

  // Doctor reports problems with the installation, and optionally repairs them.
  //
  // Server-side because the answer needs the session records and the runtime directory together, and the
  // server already has both. A client scanning the directory itself would have to reimplement the socket
  // naming and could not read the database.
  rpc Doctor(DoctorRequest) returns (DoctorResponse);

  // Signal sends a signal to a session's shell, and by default to its process group.
  //
  // Distinct from writing a control character with Send, which is not a duplicate of this: a control
  // character goes through the pty's line discipline, so it reaches whatever has the terminal and only
  // becomes a signal if that program's termios says so. This delivers a signal directly, which is what
  // reaches a program that reads its input raw, or a session with no foreground job to interrupt.
  rpc Signal(SignalRequest) returns (SignalResponse);

  // Tag sets or removes a session's tags.
  //
  // Separate from Attach because tagging an existing session must not require attaching to it: a
  // caller correcting a tag has no terminal to wire up, and opening an attach stream to change
  // metadata would create the session if the name were wrong.
  rpc Tag(TagRequest) returns (TagResponse);

  // Status reports facts about the running server: its pid, how long it has been up, and how many
  // sessions it holds.
  //
  // Separate from Doctor rather than folded into it. Doctor runs fifteen checks, several of which probe
  // every shim over its own socket and scan log files, which is the wrong amount of work for answering
  // "what is running". The two also answer different questions: this reports facts, Doctor reports
  // problems.
  rpc Status(StatusRequest) returns (StatusResponse);

  // Shutdown stops the server, leaving sessions running.
  //
  // Sessions survive by design: each shim owns its pty, so a server that exits leaves every
  // session intact and the next server adopts them. That is the upgrade path, and it needs a way
  // to ask a server to stop that does not involve finding its pid.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

message StatusRequest {}

message StatusResponse {
  // Process id of the server, so it can be found without scanning the process table.
  int32 pid = 1;
  // When the server started, as unix seconds. Sent as a timestamp rather than a duration so the client
  // renders the uptime, which keeps the two from disagreeing as the reply travels.
  int64 started_at_unix = 2;
  // The server's own build.
  string version = 3;
  // Directories in use, which is the fastest way to spot a client talking to a server started with
  // different ones.
  string runtime_dir = 4;
  string state_dir = 5;
  // Session counts by state. Separate fields rather than a map so the shape is fixed and a client does
  // not have to know which keys to expect.
  int32 sessions_running = 6;
  int32 sessions_exited = 7;
  int32 sessions_dead = 8;
  // Clients attached across every session, which says whether anything is watching.
  int32 clients = 9;
  // Whether this server has the terminal emulator. A server without it cannot restore a screen, and
  // that is a property of the server rather than of the client asking.
  bool terminal = 10;
}

// ShutdownRequest asks the server to stop.
// ReportedState is what a program in a session says about itself.
//
// Overlaps deliberately with what cm derives from OSC 133, and takes precedence over it: a program that
// says what it is doing knows better than a shell marker does. A coding agent is the case that needs
// this, since its shell reports one long-running command while the agent moves between working, waiting
// for input, and done.
enum ReportedState {
  REPORTED_STATE_UNSPECIFIED = 0;
  // IDLE means the program finished and is not waiting on anything.
  REPORTED_STATE_IDLE = 1;
  // BUSY means it is working.
  REPORTED_STATE_BUSY = 2;
  // BLOCKED means it needs input and will not progress until it gets some.
  //
  // The state OSC 133 cannot express: a shell reports a command as running whether it is computing or
  // sitting at a prompt of its own, so only the program itself can say which.
  REPORTED_STATE_BLOCKED = 3;
  // CLEAR removes a report, so the session falls back to what cm derives from the shell.
  REPORTED_STATE_CLEAR = 4;
}

message ReportRequest {
  // Empty means the session the caller is in, from CM_SESSION.
  string session = 1;
  ReportedState state = 2;
  // A short human-readable note, shown alongside the state. Optional.
  string detail = 3;
  // Who is reporting, for display and so one reporter's state is distinguishable from another's.
  // Optional; free-form.
  string source = 4;
}

message ReportResponse {}

message ReadRequest {
  string session = 1;
  // How many lines from the end. Zero means everything.
  uint32 lines = 2;
  // Return the bytes the program emitted rather than the text they rendered to.
  //
  // Bounded by lines like the plain form, which is what distinguishes this from History's vt format: that
  // renders the whole scrollback and cannot be limited. Ignored together with unwrap, which describes a
  // rendering that raw output does not go through.
  bool raw = 4;
  // Whether to rejoin soft-wrapped lines. A line the terminal broke to fit its width is one line to the
  // program that wrote it, so splitting it puts a newline inside a path or a stack frame.
  bool unwrap = 3;

  // Return output from where the last N commands began, rather than a count of lines.
  //
  // Anchored at the shell's prompt marker, so each block opens with the prompt and the echoed command
  // line. That is what makes reading several commands useful: their outputs run together otherwise, and
  // a caller cannot tell where one ended. Zero means this is not being used.
  //
  // A count of commands rather than a sequence number, deliberately. cm has two sequence-number spaces
  // and mixing them corrupts output, so a number a caller has to hold onto is a hazard; a command count
  // is also what a person and a script actually think in.
  //
  // Mutually exclusive with lines, which is a different bound on the same read.
  uint32 since_commands = 5;

  // Return only the most recent command's own output, with no prompt or echoed command line.
  //
  // The parser's counterpart to since_commands: that produces a transcript, this produces just what the
  // program printed. Well defined for one command only, which is why it is a separate field rather than
  // a mode of the other.
  bool last_output = 6;
}

message ReadResponse {
  bytes data = 1;
}

// WaitState is a condition a caller can wait for.
enum WaitState {
  WAIT_STATE_UNSPECIFIED = 0;
  // IDLE means the shell is at a prompt with no command running, from OSC 133.
  WAIT_STATE_IDLE = 1;
  // BUSY means a command is running.
  WAIT_STATE_BUSY = 2;
  // EXITED means the session ended, whatever its status.
  WAIT_STATE_EXITED = 3;
  // BLOCKED means a program in the session reported that it needs input.
  //
  // Only reachable when something reports it: a shell marks a command as running whether it is computing
  // or waiting at a prompt of its own, so this cannot be derived from OSC 133.
  WAIT_STATE_BLOCKED = 4;
}

message WaitRequest {
  string session = 1;
  WaitState until = 2;
  // How long to wait before giving up. Zero waits indefinitely.
  //
  // Milliseconds rather than a duration string: this crosses a wire, and an integer needs no parser on
  // either side.
  uint64 timeout_ms = 3;
}

message WaitResponse {
  // Whether the condition was reached, as opposed to the wait timing out.
  bool satisfied = 1;
  // What a program in the session reported about itself, if anything, and the note that came with it.
  string reported_state = 6;
  string reported_detail = 7;
  // The session's state when the wait returned, so a caller that timed out learns what it was instead.
  bool busy = 2;
  string command = 3;
  // Exit status of the last finished command, and whether there was one.
  //
  // Carried here so `cm wait --until idle` answers "did it work" in the reply that says "it finished",
  // rather than requiring a second call that races the next command starting.
  int32 last_command_exit_code = 8;
  bool command_finished = 9;
  SessionState state = 4;
  int32 exit_code = 5;
  // How much of the session's output the server had consumed when the wait returned.
  //
  // A follower needs this to know when it has caught up. The wait says the command finished, which is not
  // the same as its output having reached the client: bytes are still in flight over the stream, and a
  // caller that stops following the moment the wait returns truncates them. `cm run` on a reused session
  // lost the command's output that way about a third of the time.
  uint64 last_seq = 10;
}

message DoctorRequest {
  // Act on the fixable findings rather than only reporting them.
  bool repair = 1;
  // The calling client's build, so the server can report a mismatch with its own.
  //
  // Sent by the client rather than derived server-side, because that is the only place it is knowable: the
  // server cannot tell which binary connected to it. Empty from a client that predates this field, which
  // is itself a version difference worth reporting.
  string client_version = 2;
}

message DoctorResponse {
  repeated Finding findings = 1;
  // What a repair did, empty when repair was not requested.
  repeated string repaired = 2;
  // The server's own build, so a client can show both sides of a mismatch.
  string server_version = 3;
}

// Finding is one thing wrong with an installation.
message Finding {
  // A stable string rather than an enum, so a script matching on it keeps working as kinds are added:
  // "orphan-shim", "stale-socket", "missing-shim".
  string kind = 1;
  string session = 2;
  string socket = 3;
  // Set when a shim answered and reported them.
  int32 shim_pid = 4;
  int32 shell_pid = 5;
  string detail = 6;
  bool fixable = 7;
}

message ShutdownRequest {}

// ShutdownResponse confirms the server is stopping.
message ShutdownResponse {}

// AttachRequest is a client-to-server event. The first message on the stream must be an
// Open; everything after it is input, a resize, or a detach.
message AttachRequest {
  oneof event {
    Open open = 1;
    Input input = 2;
    Resize resize = 3;
    Detach detach = 4;
  }
}

message Open {
  // Session to attach to. Empty asks the server to allocate a unique name, which is how
  // a terminal emulator creates a per-window session without inventing names itself.
  string session = 1;

  // Initial window size.
  uint32 rows = 2;
  uint32 cols = 3;
  uint32 x_pixel = 4;
  uint32 y_pixel = 5;

  // Resume output from this sequence number instead of restoring screen state. Set by a
  // client reconnecting after the server restarted: its terminal still shows the session,
  // so it wants the bytes it missed, not a fresh repaint. Absent on a first attach.
  optional uint64 resume_from_seq = 6;

  // Take ownership of the session: if this client's connection drops without sending a
  // Detach, the server terminates the session.
  //
  // This is what makes per-window sessions work without external cleanup. Closing a
  // terminal window kills its session, while detaching deliberately, or the server
  // restarting, leaves it running. Distinguishing those cases is exactly what a terminal
  // emulator cannot do reliably from the outside.
  bool own = 7;

  // Attach without sending input or affecting sizing: a read-only follower.
  bool read_only = 8;

  // Skip the screen repaint that normally opens an attachment, streaming only what happens from now on.
  //
  // For a follower that is not painting a terminal. An interactive client wants the repaint, since it has to
  // fill an empty window with the session's current screen. Something piping output to a file wants the
  // opposite: the repaint duplicates whatever it has already printed, which is exactly what
  // `cm read --follow` produced before this existed -- the last lines twice, once rendered and once as part
  // of the restored screen.
  bool no_restore = 16;

  // Command to run instead of the user's shell. Only meaningful when creating.
  repeated string command = 9;

  // Working directory for a newly created session. Empty means the client's cwd.
  string cwd = 10;

  // Environment variables to set for a newly created session, as KEY=VALUE.
  repeated string env = 11;

  // Terminal-related variables from this client's own environment, as KEY -> VALUE.
  //
  // Recorded on every attach, not just creation. A shell in a long-lived session holds values
  // describing the terminal that started it, and reattaching from a new terminal, or the same
  // one after it restarted, makes those stale. kitty's KITTY_LISTEN_ON is the sharp case, since
  // every kitten call goes through it.
  //
  // Distinct from env above, which sets variables for a shell being created. These are recorded
  // for an existing shell to ask about later.
  map<string, string> client_env = 12;

  // Persist requests that this session's content survive a reboot, regardless of whether its name
  // matches the server's configured patterns.
  bool persist = 13;

  // OnRestore overrides the server's configured behavior when reviving this session: "shell",
  // "none", or "command". Empty means the configured default.
  //
  // A string rather than an enum because it is a per-session override of a config value that is
  // also a string, and keeping one spelling avoids two vocabularies for the same setting.
  string on_restore = 14;

  // CaptureOutput saves this session's output so it can be read after the session ends, without
  // asking for reboot survival.
  //
  // Distinct from persist because the two differ in how long the session is kept, not in mechanism.
  // `cm run` sets this so `cm history` works once the command has exited, while leaving the session
  // eligible for prompt cleanup rather than the week a persisted session is kept.
  bool capture_output = 15;

  // Tags to attach to a newly created session. Ignored when attaching to one that exists, since an
  // attach is not how tags are changed; Tag is.
  map<string, string> tags = 17;
}

message Input {
  bytes data = 1;
}

message Resize {
  uint32 rows = 1;
  uint32 cols = 2;
  uint32 x_pixel = 3;
  uint32 y_pixel = 4;
}

// Detach ends this client's attachment without terminating the session. Sending it
// explicitly is what distinguishes leaving a session from losing the connection, so an
// owning client's session survives a deliberate detach.
message Detach {
  // The client will exit without reading the acknowledgement, so do not send one.
  //
  // For a client that detaches as its last act and has nothing to do with the confirmation: `cm run -d`,
  // `cm attach --no-attach`, and a follower being interrupted. Their connection is closing as the Detach
  // goes out, so the reply loses a race about 40% of the time and the server logged a warning for behavior
  // that was intended. The session was never at risk -- the flag that protects it is set before the reply is
  // attempted -- so the warning was pure noise, and it made `cm doctor` report a healthy installation as
  // having a problem.
  //
  // An interactive client leaves this false and waits, because for an owned session the reply is what
  // guarantees the Detach was transmitted rather than discarded with the connection.
  bool no_ack = 1;
}

// AttachResponse is a server-to-client event.
message AttachResponse {
  oneof event {
    Opened opened = 1;
    Output output = 2;
    Exited exited = 3;
    Metadata metadata = 4;
    Detached detached = 5;
  }
}

// Detached confirms the server processed a client's Detach.
//
// A client must wait for this before exiting. Sending Detach and returning immediately does not work:
// the send is asynchronous, so the connection is torn down before the message is transmitted, and the
// server then sees a client that vanished without detaching. For an owned session that means being
// destroyed, which is the opposite of what detaching asks for.
message Detached {}

// Metadata reports what the shell has said about itself, so a client can act on it.
//
// A terminal emulator needs this: retitling a tab, or opening a new window in the session's
// directory, requires knowing values that the shell reported to the multiplexer rather than to the
// terminal. Sent on attach and whenever a value changes.
message Metadata {
  string title = 1;
  // Working directory, decoded from OSC 7 rather than the raw URI the shell sent.
  string cwd = 2;
  // Whether cwd exists on the client's machine. False once a session has ssh'd elsewhere, in
  // which case acting on the path locally is wrong.
  bool cwd_is_local = 3;

  // Whether a command is running, and which one, from OSC 133. See the same fields on Session.
  //
  // Forwarded as an event rather than left to polling so a terminal emulator can react as it happens,
  // which is the difference between a tab that shows what is running and one that shows it a second
  // later.
  bool busy = 4;
  string command = 5;
  // Exit status of the last finished command, and whether there was one. See Session for why these are
  // separate from the session's own status.
  int32 last_command_exit_code = 9;
  bool command_finished = 10;
  // What a program in the session reported about itself, which takes precedence over busy above.
  string reported_state = 6;
  string reported_detail = 7;
}

message Opened {
  // Resolved session name, which the client needs when it asked the server to allocate
  // one.
  string session = 1;
  // Whether this call created the session.
  bool created = 2;
  // Bytes to write to the terminal before streaming output: either serialized screen
  // state on a fresh attach, or nothing when resuming.
  bytes restore = 3;
  // Sequence number the following output stream starts at. A client tracks this so it can
  // resume from the right place after a reconnect.
  uint64 next_seq = 4;
}

message Output {
  uint64 seq = 1;
  bytes data = 2;
  // Set when output was truncated before the requested sequence, so the client knows its
  // view has a hole and should reattach fresh rather than assume continuity.
  bool gap = 3;
}

// Exited reports that the session's shell exited, so the client should stop rather than
// try to reconnect.
message Exited {
  int32 exit_code = 1;
}

message SignalRequest {
  string session = 1;
  // Signal number, as in signal(3). A number rather than an enum because the set is
  // platform-defined: enumerating it here would mean either a list that disagrees with the host or a
  // second vocabulary for something the operating system already names.
  int32 signal = 2;
  // Send to the shell's process group rather than the shell alone.
  //
  // Defaults to the group when unset, since that is what a keypress does: the pty delivers to the
  // foreground process group, so a signal reaching only the shell would leave the job a caller meant
  // to stop still running. process_only opts out for the rare case of signalling the shell itself.
  bool process_only = 3;
}

message SignalResponse {}

message TagRequest {
  // Empty means the session the caller is in, from CM_SESSION.
  string session = 1;
  // Tags to set, replacing any existing value for the same key. A key with an empty value is a
  // valid tag, so this cannot express removal; remove does.
  map<string, string> set = 2;
  // Keys to remove. A key that is not present is not an error, since the caller's intent is
  // satisfied either way.
  repeated string remove = 3;
  // Discard every existing tag before applying set, so a caller can define the whole set rather
  // than editing it.
  bool replace = 4;
}

message TagResponse {
  // The session's tags after the change, so a caller does not need a second call to see the result.
  map<string, string> tags = 1;
}

message ListRequest {
  // Only sessions whose name matches this prefix. Empty matches all.
  string prefix = 1;
  // Only sessions carrying all of these tags, as "key" or "key=value". A bare key matches whatever
  // its value is.
  //
  // Repeated terms narrow rather than widen: a caller asking for two tags wants the sessions that
  // have both. There is deliberately no negation or set membership, which would be more selector
  // grammar than filtering tens of sessions justifies and can be added later without changing this.
  //
  // Strings rather than a map so a bare key is expressible: a map entry with an empty value cannot
  // distinguish "has this key" from "has this key set to empty".
  repeated string tags = 2;
}

message ListResponse {
  repeated Session sessions = 1;
}

// SessionState is a session's lifecycle stage.
enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  // The session has a live shim holding a running shell.
  SESSION_STATE_RUNNING = 1;
  // The shell exited, and exit_code says with what.
  SESSION_STATE_EXITED = 2;
  // The shim could not be reached. Distinct from exited because the outcome is unknown rather
  // than observed, so exit_code means nothing.
  SESSION_STATE_DEAD = 3;
}

message Session {
  string name = 1;
  int32 shell_pid = 2;
  // Number of attached clients.
  uint32 clients = 3;
  // Working directory, as reported by the shell via OSC 7. May be empty if the shell
  // does not report it.
  string cwd = 4;
  // Whether cwd is on this host. A session that has ssh'd elsewhere reports a path that
  // does not exist locally, so acting on it, such as opening a new window there, is
  // wrong.
  bool cwd_is_local = 5;
  string title = 6;
  int64 created_at_unix = 7;
  bool exited = 8;
  int32 exit_code = 9;

  // Lifecycle stage. Preferred over exited, which cannot distinguish a shell that exited from a
  // shim that vanished; exited remains for compatibility.
  SessionState state = 10;
  // Working directory as the shell reported it, which is a URI for OSC 7 and keeps the host, so a
  // caller can tell a remote directory from a local one. cwd holds the decoded local path.
  string cwd_uri = 11;

  // What a program in the session reported about itself, if anything: "idle", "busy", or "blocked".
  //
  // Empty when nothing has reported, in which case busy below is what cm derived from the shell. When
  // both are present this one wins, since a program describing itself is better evidence than a shell
  // marker.
  string reported_state = 14;
  // The note that came with the report, and who sent it. Both optional and free-form.
  string reported_detail = 15;
  string reported_source = 16;

  // Whether a command is running, as opposed to the shell sitting at a prompt, from OSC 133.
  //
  // A terminal emulator needs this to decide whether closing a window is destructive: the shell owns
  // the pty, so kitty only ever sees `cm attach` running and cannot tell a busy session from an idle
  // one. False for a shell with no OSC 133 support, since nothing then reports otherwise.
  bool busy = 12;
  // The command line the shell reported running, when it reported one.
  //
  // Best effort: the cmdline parameter is an extension that zsh and bash send under kitty's shell
  // integration and other shells omit, so this can be empty while busy is true.
  string command = 13;

  // Exit status of the last command the shell finished, from OSC 133;D.
  //
  // Distinct from exit_code above, which is the *session's* own status: that says whether the shell
  // itself has gone, this says whether the last thing it ran succeeded. Conflating them would report a
  // failed build as a dead session.
  //
  // command_finished is what makes the value readable, since zero is a real exit status and cannot
  // double as "nothing has finished yet". False for a shell whose integration omits the status
  // parameter, which is legal: kitty's zsh integration sends `133;D;<status>` while a bare `133;D`
  // carries none.
  int32 last_command_exit_code = 17;
  bool command_finished = 18;

  // The caller's own key/value labels for this session.
  //
  // Persisted, unlike the reported state above: a report describes a running program, while a tag
  // describes the session, so it must survive a server restart and a reboot restore.
  //
  // cm never interprets a key. There is no tag that changes how a session is treated, because
  // inferring meaning from one would be the same mistake as scraping a screen to work out what is
  // running.
  map<string, string> tags = 19;
}

message KillRequest {
  repeated string sessions = 1;
  // Remove the session record even if its shim cannot be reached, and end the session with SIGKILL
  // rather than SIGHUP.
  //
  // Without the first, an unreachable shim is left alone: it may be busy rather than dead, and
  // discarding the record would orphan it permanently. The second half is what makes the flag mean "be
  // maximally forceful", so a caller that has decided a session must go does not need two flags to say
  // it.
  bool force = 2;
  // Signal to end the session with, overriding the default.
  //
  // Zero means SIGHUP, or SIGKILL when force is set. Exists because the default is a request rather
  // than a guarantee: a job that ignores SIGHUP survives it, and `cm kill` then reports success having
  // left a process holding a pty. A caller that knows what it is stopping can name the signal instead
  // of reaching for force, which also discards bookkeeping.
  //
  // A number rather than an enum, for the same reason SignalRequest uses one: the set is
  // platform-defined.
  int32 signal = 3;
}

message KillResponse {
  repeated string killed = 1;
  // Sessions that could not be killed, keyed by name.
  map<string, string> errors = 2;
  // Sessions whose processes survived the signal, keyed by name, with the pids still alive.
  //
  // Reported rather than folded into errors, because the kill did not fail: the session is gone from cm's
  // view and the record is deleted. What is left is a process holding a pty that nothing will reattach
  // to, which is a warning about a leak rather than a failed request.
  //
  // Empty is also what an older shim reports, so this cannot distinguish "nothing survived" from "the
  // shim does not check". That only ever costs a warning, which is why it needs no capability probe.
  map<string, SurvivingProcesses> surviving = 3;
}

// SurvivingProcesses lists pids that outlived a signal.
message SurvivingProcesses {
  repeated int32 pids = 1;
}

message SendRequest {
  string session = 1;
  bytes data = 2;

  // Wait for a state after delivering the input, in the same request.
  //
  // One request rather than a send followed by a wait, because the two cannot be ordered from outside:
  // a command that finishes before the second call arrives leaves the caller waiting for a transition
  // that already happened. The server arms the wait before it writes the input, so there is no window.
  WaitState wait_until = 3;
  uint64 wait_timeout_ms = 4;
}

message SendResponse {
  // Whether the session has ever reported a command via OSC 133, at the moment the input was sent.
  //
  // Reported so a client can warn that a wait may never resolve. It has to come from the server: the signal is
  // a monotonic counter of commands seen, and the fields a client can already read -- busy, and the current
  // command -- are cleared once a command finishes, so a fast one leaves nothing behind. That is the same trap
  // the counter was introduced for.
  bool shell_reports = 3;
  // Present only when wait_until was set. Reports the same thing Wait does.
  WaitResponse wait = 1;
}

// HistoryFormat selects how session contents are rendered.
enum HistoryFormat {
  // Plain text, suitable for piping to a file or a pager.
  HISTORY_FORMAT_UNSPECIFIED = 0;
  // Escape sequences, preserving colors and styling.
  HISTORY_FORMAT_VT = 1;
  // HTML, preserving styling.
  HISTORY_FORMAT_HTML = 2;
}

message HistoryRequest {
  string session = 1;
  HistoryFormat format = 2;
}

message HistoryResponse {
  bytes data = 1;
}

message GetEnvRequest {
  string session = 1;
}

message GetEnvResponse {
  // Variables the latest client reported, as KEY -> VALUE.
  map<string, string> env = 1;
}
